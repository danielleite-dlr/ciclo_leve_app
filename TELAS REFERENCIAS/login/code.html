<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Entrar - App de Saúde Feminina</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "primary-dark": "#0fb847",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#162b1f",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem", 
                        "lg": "1.5rem", 
                        "xl": "2rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#111813] dark:text-gray-100 font-display transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark">
<div class="flex items-center p-4 pb-2 justify-between">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-[#111813] dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1"></div>
</div>
<div class="px-6 pt-2 pb-6 flex flex-col items-center">
<div class="mb-6 size-20 rounded-3xl bg-primary/20 flex items-center justify-center text-primary dark:text-primary">
<span class="material-symbols-outlined text-[40px]">female</span>
</div>
<h1 class="text-[#111813] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center mb-2">Entrar</h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal text-center max-w-[280px]">
                Acesse sua conta para acompanhar seu ciclo e gerenciar sua saúde.
            </p>
</div>
<form class="flex flex-col gap-5 px-6 w-full" onsubmit="event.preventDefault()">
<div class="flex flex-col gap-2">
<label class="text-[#111813] dark:text-gray-200 text-sm font-medium pl-1" for="email">E-mail</label>
<div class="relative">
<input class="form-input w-full rounded-full border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark focus:border-primary focus:ring-primary h-14 px-6 text-base placeholder:text-gray-400 dark:placeholder:text-gray-500 text-[#111813] dark:text-white transition-all shadow-sm" id="email" placeholder="Digite seu e-mail" type="email" value=""/>
<span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#111813] dark:text-gray-200 text-sm font-medium pl-1" for="password">Senha</label>
<div class="relative">
<input class="form-input w-full rounded-full border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark focus:border-primary focus:ring-primary h-14 px-6 pr-12 text-base placeholder:text-gray-400 dark:placeholder:text-gray-500 text-[#111813] dark:text-white transition-all shadow-sm" id="password" placeholder="Digite sua senha" type="password" value=""/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[22px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1 px-1">
<a class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
                        Esqueci minha senha
                    </a>
</div>
</div>
<button class="mt-4 w-full h-14 bg-primary hover:bg-primary-dark text-[#052e11] font-bold text-lg rounded-full shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Entrar
            </button>
</form>
<div class="mt-auto pb-10 text-center px-4">
<p class="text-gray-600 dark:text-gray-400 text-sm">
                Não tem uma conta? 
                <a class="font-bold text-[#111813] dark:text-white hover:text-primary dark:hover:text-primary transition-colors ml-1" href="#">Cadastre-se</a>
</p>
</div>
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[30%] bg-primary/10 rounded-full blur-[80px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[50%] h-[30%] bg-primary/5 rounded-full blur-[80px] pointer-events-none -z-10"></div>
</div>

</body></html>
