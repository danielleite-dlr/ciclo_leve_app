

services:
  postgres:
    image: postgres:15-alpine
    container_name: cicloleve_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: cicloleve
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cicloleve_net

  redis:
    image: redis:7-alpine
    container_name: cicloleve_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cicloleve_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cicloleve_api
    depends_on:
      - postgres
      - redis
    environment:
      # Internal service hostnames on cicloleve_net
      PORT: "3000"
      DATABASE_URL: "postgresql://admin:adminpassword@postgres:5432/cicloleve?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev-change-me"
      JWT_REFRESH_SECRET: "dev-change-me-too"
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    networks:
      - cicloleve_net

volumes:
  postgres_data:
  redis_data:

networks:
  cicloleve_net:
    driver: bridge
