<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CicloLeve - Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-300">
<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col justify-between overflow-hidden">
<!-- Decorative Ambient Backgrounds -->
<div class="absolute top-[-10%] right-[-20%] h-[400px] w-[400px] rounded-full bg-primary/10 blur-[100px] dark:bg-primary/5 pointer-events-none"></div>
<div class="absolute bottom-[10%] left-[-10%] h-[300px] w-[300px] rounded-full bg-primary/5 blur-[80px] dark:bg-primary/5 pointer-events-none"></div>
<!-- Center Content: Logo & Title -->
<div class="flex flex-1 flex-col items-center justify-center px-6 z-10">
<!-- Logo Icon Container -->
<div class="group relative mb-8 flex h-28 w-28 items-center justify-center rounded-[2rem] bg-white shadow-2xl shadow-primary/10 ring-1 ring-black/5 dark:bg-[#1a2c20] dark:ring-white/5 transition-transform duration-700 hover:scale-105">
<div class="absolute inset-0 rounded-[2rem] bg-primary/10 blur-xl opacity-0 transition-opacity duration-700 group-hover:opacity-100"></div>
<span class="material-symbols-outlined text-[64px] text-primary relative z-10" style="font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 48;">
                    female
                </span>
</div>
<!-- Headline Text -->
<div class="flex flex-col items-center text-center">
<h1 class="text-[#111813] dark:text-white tracking-tight text-[36px] font-bold leading-tight pb-3">
                    CicloLeve
                </h1>
<!-- Meta Text / Tagline -->
<p class="text-[#61896f] dark:text-[#a1b8aa] text-sm font-normal leading-relaxed max-w-[260px]">
                    Seu corpo muda, sua estratégia também.
                </p>
</div>
</div>
<!-- Bottom Section: Progress Bar & Version -->
<div class="w-full px-8 pb-12 z-10">
<!-- Progress Bar Component -->
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between items-end">
<p class="text-[#111813] dark:text-[#e0e6e2] text-sm font-medium leading-normal pl-1">Verificando status...</p>
<p class="text-[#61896f] dark:text-[#8baaa1] text-xs font-normal leading-normal">80%</p>
</div>
<div class="h-2 w-full rounded-full bg-[#dbe6df] dark:bg-[#1f3526] overflow-hidden p-[2px]">
<div class="h-full w-[80%] rounded-full bg-primary shadow-[0_0_12px_rgba(19,236,91,0.6)] animate-pulse"></div>
</div>
</div>
<!-- Version Footer -->
<div class="mt-8 text-center">
<p class="text-[#9aa09c] dark:text-[#4a6354] text-[10px] font-medium tracking-widest uppercase">Versão 2.1.0</p>
</div>
</div>
</div>
</body></html>
